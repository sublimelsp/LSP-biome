[tool.pyright]
pythonVersion = "3.8"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = 'py38'

[tool.ruff.lint]
# Enable preview rules.
preview = true
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
case-sensitive = false
force-single-line = true
from-first = true
no-sections = true
order-by-type = false
required-imports = ["from __future__ import annotations"]

[tool.tox]
env_list = ["py3"]
skipsdist = true

[tool.tox.env_run_base]
deps = [
    "ruff==0.15.10",
]
commands = [
    ["ruff", "check"],
]
